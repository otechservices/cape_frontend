<div
  class="tw-min-h-screen tw-flex tw-items-center tw-justify-center tw-py-20 tw-bg-cover tw-bg-center tw-relative"
  [ngStyle]="{'background-image': 'url(assets/login.jpg)'}"
>
  <div class="tw-absolute tw-inset-0 tw-bg-white/80"></div>

  <div class="tw-relative tw-z-10 tw-w-full tw-max-w-md tw-px-6">
    <div class="tw-bg-white tw-rounded-2xl tw-shadow-2xl tw-p-8">

      <div class="tw-text-center tw-mb-8">
        <div class="tw-w-16 tw-h-16 tw-bg-blue-100 tw-rounded-full tw-flex tw-items-center tw-justify-center tw-mx-auto tw-mb-4">
          <i class="ri-shield-keyhole-line tw-text-2xl tw-text-blue-600"></i>
        </div>
        <h1 class="tw-text-2xl tw-font-bold tw-text-gray-900 tw-mb-2">Nouveau mot de passe</h1>
        <p class="tw-text-gray-600 tw-text-sm">Choisissez un mot de passe sécurisé d'au moins 8 caractères.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="tw-space-y-6">

        <div>
          <label for="password" class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">
            Nouveau mot de passe <span class="text-danger">(*)</span>
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Minimum 8 caractères"
            class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm"
          />
          <p
            *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
            class="tw-text-red-500 tw-text-xs tw-mt-1"
          >
            Le mot de passe doit contenir au moins 8 caractères.
          </p>
        </div>

        <div>
          <label for="password_confirmation" class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">
            Confirmer le mot de passe <span class="text-danger">(*)</span>
          </label>
          <input
            id="password_confirmation"
            type="password"
            formControlName="password_confirmation"
            placeholder="Répétez votre mot de passe"
            class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm"
          />
        </div>

        <div *ngIf="errorMessage" class="tw-bg-red-50 tw-border tw-border-red-200 tw-rounded-lg tw-p-4 tw-flex tw-items-center">
          <i class="ri-error-warning-line tw-text-red-600 tw-text-xl tw-mr-3"></i>
          <p class="tw-text-red-800 tw-text-sm">{{ errorMessage }}</p>
        </div>

        <button
          type="submit"
          [disabled]="form.invalid || isSubmitting"
          class="tw-w-full tw-bg-blue-600 hover:tw-bg-blue-700 disabled:tw-bg-gray-400 disabled:tw-cursor-not-allowed tw-text-white tw-py-3 tw-rounded-lg tw-font-medium tw-transition-colors tw-duration-200 tw-flex tw-items-center tw-justify-center tw-space-x-2"
        >
          <ng-container *ngIf="isSubmitting">
            <i class="ri-loader-4-line tw-animate-spin tw-text-xl"></i>
            <span>Réinitialisation...</span>
          </ng-container>
          <ng-container *ngIf="!isSubmitting">
            <span>Réinitialiser mon mot de passe</span>
            <i class="ri-arrow-right-line tw-text-xl"></i>
          </ng-container>
        </button>
      </form>

      <div class="tw-mt-6 tw-text-center">
        <a routerLink="/public/auth/login" class="tw-text-blue-600 hover:tw-text-blue-700 tw-font-medium tw-text-sm">
          Retour à la connexion
        </a>
      </div>

    </div>
  </div>
</div>
