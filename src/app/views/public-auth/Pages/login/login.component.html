<div
  class="tw-min-h-screen tw-flex tw-items-center tw-justify-center tw-py-20 tw-bg-cover tw-bg-center tw-relative"
  [ngStyle]="{'background-image': 'url(https://readdy.ai/api/search-image?query=Professional%20African%20business%20person%20working%20on%20laptop%20in%20modern%20bright%20office%20environment%2C%20government%20building%20in%20background%2C%20clean%20minimalist%20workspace%2C%20warm%20natural%20lighting%2C%20welcoming%20atmosphere%20for%20user%20authentication%20and%20login&width=1920&height=1080&seq=login-bg&orientation=landscape)'}"
>
  <div class="tw-absolute tw-inset-0 tw-bg-white/80"></div>

  <div class="tw-relative tw-z-10 tw-w-full tw-max-w-md tw-px-6">
    <div class="tw-bg-white tw-rounded-2xl tw-shadow-2xl tw-p-8">
      <div class="tw-text-center tw-mb-8">
        <div class="tw-w-16 tw-h-16 tw-bg-blue-100 tw-rounded-full tw-flex tw-items-center tw-justify-center tw-mx-auto tw-mb-4">
          <i class="ri-user-line tw-text-2xl tw-text-blue-600"></i>
        </div>
        <h1 class="tw-text-2xl tw-font-bold tw-text-gray-900 tw-mb-2">Connexion</h1>
        <p class="tw-text-gray-600">Accédez à votre espace personnel</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()" class="tw-space-y-6">
        <div>
          <label for="email" class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Adresse email*</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="votre.email@exemple.com"
            class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-lg tw-focus:ring-2 tw-focus:ring-blue-500 tw-focus:border-transparent tw-text-sm"
          />
        </div>

        <div>
          <label for="password" class="tw-block tw-text-sm tw-font-medium tw-text-gray-700 tw-mb-2">Mot de passe*</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Votre mot de passe"
            class="tw-w-full tw-px-4 tw-py-3 tw-border tw-border-gray-300 tw-rounded-lg tw-focus:ring-2 tw-focus:ring-blue-500 tw-focus:border-transparent tw-text-sm"
          />
        </div>

        <div *ngIf="submitStatus === 'success'" class="tw-bg-green-50 tw-border tw-border-green-200 tw-rounded-lg tw-p-4 tw-flex tw-items-center">
          <i class="ri-check-circle-line tw-text-green-600 tw-text-xl tw-mr-3"></i>
          <p class="tw-text-green-800">Connexion réussie ! Redirection vers votre dashboard...</p>
        </div>

        <div *ngIf="submitStatus === 'error'" class="tw-bg-red-50 tw-border tw-border-red-200 tw-rounded-lg tw-p-4 tw-flex tw-items-center">
          <i class="ri-error-warning-line tw-text-red-600 tw-text-xl tw-mr-3"></i>
          <p class="tw-text-red-800">Email ou mot de passe incorrect. Veuillez réessayer.</p>
        </div>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="tw-w-full tw-bg-blue-600 hover:tw-bg-blue-700 disabled:tw-bg-gray-400 disabled:tw-cursor-not-allowed tw-text-white tw-py-3 tw-rounded-lg tw-font-medium tw-transition-colors tw-duration-200 tw-flex tw-items-center tw-justify-center tw-space-x-2 tw-whitespace-nowrap"
        >
          <ng-container *ngIf="isSubmitting">
            <i class="ri-loader-4-line tw-animate-spin tw-text-xl"></i>
            <span>Connexion...</span>
          </ng-container>
          <ng-container *ngIf="!isSubmitting">
            <span>Se connecter</span>
            <i class="ri-arrow-right-line tw-text-xl"></i>
          </ng-container>
        </button>
      </form>

      <div class="tw-mt-6 tw-text-center">
        <p class="tw-text-gray-600">
          Pas encore de compte ?
          <a routerLink="/public/auth/register" class="tw-text-blue-600 hover:tw-text-blue-700 tw-font-medium">Créer un compte</a>
        </p>
      </div>
    </div>
  </div>
</div>
