<header #headerRoot class="tw-fixed tw-top-0 tw-left-0 tw-w-full tw-bg-white tw-shadow-sm tw-z-50">
  <div class="tw-w-full tw-px-4 tw-py-3 tw-overflow-visible">
    <div class="tw-flex tw-items-center tw-justify-between">
      <!-- Logo -->
      <div class="tw-flex tw-items-center tw-space-x-3">
        <a routerLink="/">
          <img
            src="https://cape.social.gouv.bj/assets/template2/images/logo-masm.png"
            alt="LOGO MASM"
            class="tw-h-12 tw-object-contain"
          />
        </a>
      </div>

      <!-- Bouton menu mobile -->
      <button
        (click)="toggleMenu()"
        class="md:tw-hidden tw-text-blue-700 tw-text-3xl tw-p-2 tw-rounded-lg hover:tw-bg-blue-50 focus:tw-outline-none focus:tw-ring-2 focus:tw:ring-blue-500"
        aria-label="Ouvrir le menu"
      >
        <i class="ri-menu-line"></i>
      </button>

      <!-- Nav Desktop -->
      <nav class="tw-hidden md:tw-flex tw-items-center tw-space-x-8">
        <a routerLink="/" class="tw-text-blue-600 tw-font-medium hover:tw-text-blue-700 tw-cursor-pointer">ACCUEIL</a>

        <!-- PROCEDURE D'INSCRIPTION (wrapper: important pour mouseleave) -->
        <div class="tw-relative" (mouseleave)="closeSubmenu()">
          <button
            (mouseenter)="openSubmenu('inscription')"
            (click)="toggleSubmenu('inscription')"
            aria-haspopup="true"
            [attr.aria-expanded]="openMenu === 'inscription'"
            class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer tw-flex tw-items-center"
          >
            PROCEDURE D'INSCRIPTION
            <i class="ri-arrow-down-s-line tw-ml-1"></i>
          </button>

          <div
            *ngIf="openMenu === 'inscription'"
            (mouseenter)="openSubmenu('inscription')"
            role="menu"
            class="tw-absolute tw-top-full tw-left-0 tw-mt-1 tw-w-56 tw-bg-white tw-shadow-lg tw-rounded-lg tw-z-50 tw-py-2"
          >
            <a routerLink="/details/cape" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50" role="menuitem">CAPE</a>
            <a routerLink="/details/garderie" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50" role="menuitem">Garderie</a>
          </div>
        </div>

        <!-- DÉLIBÉRATIONS -->
        <div class="tw-relative" (mouseleave)="closeSubmenu()">
          <button
            (mouseenter)="openSubmenu('deliberations')"
            (click)="toggleSubmenu('deliberations')"
            aria-haspopup="true"
            [attr.aria-expanded]="openMenu === 'deliberations'"
            class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer tw-flex tw-items-center"
          >
            DÉLIBÉRATIONS
            <i class="ri-arrow-down-s-line tw-ml-1"></i>
          </button>

          <div
            *ngIf="openMenu === 'deliberations'"
            (mouseenter)="openSubmenu('deliberations')"
            role="menu"
            class="tw-absolute tw-top-full tw-left-0 tw-mt-1 tw-w-56 tw-bg-white tw-shadow-lg tw-rounded-lg tw-z-50 tw-py-2"
          >
            <a routerLink="/results/cape" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50" role="menuitem">Délibérations CAPE</a>
            <a routerLink="/results/garderie" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50" role="menuitem">Délibérations Garderie</a>
          </div>
        </div>

        <!-- Structures autorisées (exemple, même pattern) -->
        <div class="tw-relative" (mouseleave)="closeSubmenu()">
          <button
            (mouseenter)="openSubmenu('structures')"
            (click)="toggleSubmenu('structures')"
            aria-haspopup="true"
            [attr.aria-expanded]="openMenu === 'structures'"
            class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer tw-flex tw-items-center"
          >
            STRUCTURES AUTORISÉES
            <i class="ri-arrow-down-s-line tw-ml-1"></i>
          </button>

          <div
            *ngIf="openMenu === 'structures'"
            (mouseenter)="openSubmenu('structures')"
            role="menu"
            class="tw-absolute tw-top-full tw-left-0 tw-mt-1 tw-w-64 tw-bg-white tw-shadow-lg tw-rounded-lg tw-z-50 tw-py-2"
          >
            <a routerLink="/structures/authorized/cape" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50">CAPE Autorisés</a>
            <a routerLink="/structures/authorized/garderie" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50">Garderies Autorisées</a>
          </div>
        </div>

        <a routerLink="/actualites" class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer">ACTUALITÉS</a>
        <a routerLink="/contact" class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer">CONTACT</a>
      </nav>

      <!-- Boutons connexion -->
      <div class="tw-hidden md:tw-flex tw-items-center tw-space-x-4">
        <ng-container *ngIf="isLoggedIn; else guestLinks">
          <a routerLink="/dashboard" class="tw-bg-blue-600 hover:tw-bg-blue-700 tw-text-white tw-px-6 tw-py-2 tw-rounded-lg tw-font-medium">Mon Espace</a>
        </ng-container>
        <ng-template #guestLinks>
          <a routerLink="/public/auth/login" class="tw-text-blue-600 hover:tw-text-blue-700 tw-font-medium">Se connecter</a>
          <a routerLink="/public/auth/register" class="tw-bg-blue-600 hover:tw-bg-blue-700 tw-text-white tw-px-6 tw-py-2 tw-rounded-lg tw-font-medium">S'inscrire</a>
        </ng-template>
      </div>
    </div>
  </div>
</header>

<!-- Menu mobile -->
<aside
  *ngIf="menuOpen"
  class="tw-fixed tw-inset-0 tw-z-50 tw-bg-black/50 tw-flex tw-justify-end md:tw-hidden tw-overflow-x-hidden"
  (click)="toggleMenu()"
>
  <div
    class="tw-w-[16rem] tw-max-w-[80vw] tw-bg-white tw-h-full tw-shadow-lg tw-overflow-y-auto tw-p-6 tw-space-y-4 tw-animate-slideInRight"
    (click)="$event.stopPropagation()"
  >
    <!-- Bouton fermer -->
    <button
      class="tw-absolute tw-top-4 tw-right-4 tw-text-gray-600 hover:tw-text-gray-900"
      (click)="toggleMenu()"
      aria-label="Fermer le menu"
    >
      <i class="ri-close-line tw-text-2xl"></i>
    </button>

    <!-- Logo -->
    <div class="tw-flex tw-items-center tw-space-x-2 tw-mb-6">
      <img
        src="https://cape.social.gouv.bj/assets/template2/images/logo-masm.png"
        alt="LOGO MASM"
        class="tw-h-10"
      />
      <span class="tw-font-semibold tw-text-gray-800">MASM</span>
    </div>

    <!-- Liens -->
    <nav class="tw-flex tw-flex-col tw-space-y-3">
      <a routerLink="/" class="tw-text-gray-700 hover:tw-text-blue-600">ACCUEIL</a>

      <div>
        <button (click)="toggleSubmenu('inscription')" class="tw-font-semibold tw-text-gray-800 tw-w-full tw-text-left">
          PROCÉDURE D'INSCRIPTION
        </button>
        <div *ngIf="openMenu === 'inscription'" class="tw-ml-3 tw-mt-2 tw-flex tw-flex-col tw-space-y-2">
          <a routerLink="/details/cape" class="tw-text-gray-600 hover:tw-text-blue-600">CAPE</a>
          <a routerLink="/details/garderie" class="tw-text-gray-600 hover:tw-text-blue-600">Garderie</a>
        </div>
      </div>

      <div>
        <button (click)="toggleSubmenu('deliberations')" class="tw-font-semibold tw-text-gray-800 tw-w-full tw-text-left">
          DÉLIBÉRATIONS
        </button>
        <div *ngIf="openMenu === 'deliberations'" class="tw-ml-3 tw-mt-2 tw-flex tw-flex-col tw-space-y-2">
          <a routerLink="/results/cape" class="tw-text-gray-600 hover:tw-text-blue-600">CAPE</a>
          <a routerLink="/results/garderie" class="tw-text-gray-600 hover:tw-text-blue-600">Garderie</a>
        </div>
      </div>

      <a routerLink="/actualites" class="tw-text-gray-700 hover:tw-text-blue-600">ACTUALITÉS</a>
      <a routerLink="/contact" class="tw-text-gray-700 hover:tw-text-blue-600">CONTACT</a>

      <hr class="tw-my-4" />

      <ng-container *ngIf="isLoggedIn; else guestLinksMobile">
        <a routerLink="/dashboard" class="tw-bg-blue-600 tw-text-white tw-font-medium tw-px-4 tw-py-2 tw-rounded-lg tw-text-center">Mon Espace</a>
      </ng-container>
      <ng-template #guestLinksMobile>
        <a routerLink="/public/auth/login" class="tw-text-blue-600 tw-font-medium tw-text-center">Se connecter</a>
        <a routerLink="/public/auth/register" class="tw-bg-blue-600 tw-text-white tw-font-medium tw-px-4 tw-py-2 tw-rounded-lg tw-text-center">S'inscrire</a>
      </ng-template>
    </nav>
  </div>
</aside>
