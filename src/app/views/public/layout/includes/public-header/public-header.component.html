<header class="tw-fixed tw-top-0 tw-left-0 tw-right-0 tw-bg-white tw-shadow-sm tw-z-50 tw-mb-50">
  <div class="tw-w-full tw-px-6 tw-py-4">
    <div class="tw-flex tw-items-center tw-justify-between">
      
      <!-- Logo -->
      <div class="tw-flex tw-items-center tw-space-x-3">
        <a routerLink="/">
        <img 
          src="https://cape.social.gouv.bj/assets/template2/images/logo-masm.png" 
          alt="LOGO MASM" 
          class="tw-h-12 tw-object-contain"
        />
        </a>
      </div>

      <!-- Menu desktop -->
      <nav class="tw-hidden md:tw-flex tw-items-center tw-space-x-8">
        <a routerLink="/" class="tw-text-blue-600 tw-font-medium hover:tw-text-blue-700 tw-cursor-pointer">
          ACCUEIL
        </a>

        <!-- Menu Inscriptions -->
        <div class="tw-relative tw-group">
          <button class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer tw-flex tw-items-center">
            PROCEDURE D'INSCRIPTION
            <i class="ri-arrow-down-s-line tw-ml-1"></i>
          </button>
          <div class="tw-absolute tw-top-full tw-left-0 tw-mt-2 tw-w-56 tw-bg-white tw-shadow-lg tw-rounded-lg tw-opacity-0 tw-invisible group-hover:tw-opacity-100 group-hover:tw-visible tw-transition-all tw-duration-200 tw-z-50">
            <div class="tw-py-2">
              <a routerLink="/details/cape" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50 hover:tw-text-blue-600">
                CAPE
              </a>
              <a routerLink="/details/garderie" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50 hover:tw-text-blue-600">
                Garderie
              </a>
            </div>
          </div>
        </div>

        <!-- Menu Délibérations -->
        <div class="tw-relative tw-group">
          <button class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer tw-flex tw-items-center">
            DÉLIBÉRATIONS
            <i class="ri-arrow-down-s-line tw-ml-1"></i>
          </button>
          <div class="tw-absolute tw-top-full tw-left-0 tw-mt-2 tw-w-56 tw-bg-white tw-shadow-lg tw-rounded-lg tw-opacity-0 tw-invisible group-hover:tw-opacity-100 group-hover:tw-visible tw-transition-all tw-duration-200 tw-z-50">
            <div class="tw-py-2">
              <a routerLink="/results/cape" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50 hover:tw-text-blue-600">
                Délibérations CAPE
              </a>
              <a routerLink="/results/garderie" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50 hover:tw-text-blue-600">
                Délibérations Garderie
              </a>
            </div>
          </div>
        </div>

        <!-- Menu Structures Autorisées -->
        <div class="tw-relative tw-group">
          <button class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer tw-flex tw-items-center">
            STRUCTURES AUTORISÉES
            <i class="ri-arrow-down-s-line tw-ml-1"></i>
          </button>
          <div class="tw-absolute tw-top-full tw-left-0 tw-mt-2 tw-w-64 tw-bg-white tw-shadow-lg tw-rounded-lg tw-opacity-0 tw-invisible group-hover:tw-opacity-100 group-hover:tw-visible tw-transition-all tw-duration-200 tw-z-50">
            <div class="tw-py-2">
              <a routerLink="/structures/authorized/cape" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50 hover:tw-text-blue-600">
                CAPE Autorisés
              </a>
              <a routerLink="/structures/authorized/garderie" class="tw-block tw-px-4 tw-py-2 tw-text-gray-700 hover:tw-bg-blue-50 hover:tw-text-blue-600">
                Garderies Autorisées
              </a>
            </div>
          </div>
        </div>

        <a routerLink="/actualites" class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer">
          ACTUALITÉS
        </a>
        <a routerLink="/contact" class="tw-text-gray-700 hover:tw-text-blue-600 tw-cursor-pointer">
          CONTACT
        </a>
      </nav>

      <!-- Boutons connexion -->
      <div class="tw-flex tw-items-center tw-space-x-4">
        <ng-container *ngIf="isLoggedIn; else guestLinks">
          <a routerLink="/dashboard" class="tw-bg-blue-600 hover:tw-bg-blue-700 tw-text-white tw-px-6 tw-py-2 tw-rounded-lg tw-font-medium tw-transition-colors tw-duration-200 tw-cursor-pointer tw-whitespace-nowrap">
            Mon Espace
          </a>
        </ng-container>
        <ng-template #guestLinks>
          <a routerLink="/public/auth/login" class="tw-text-blue-600 hover:tw-text-blue-700 tw-font-medium tw-cursor-pointer tw-whitespace-nowrap">
            Se connecter
          </a>
          <a routerLink="/public/auth/register" class="tw-bg-blue-600 hover:tw-bg-blue-700 tw-text-white tw-px-6 tw-py-2 tw-rounded-lg tw-font-medium tw-transition-colors tw-duration-200 tw-cursor-pointer tw-whitespace-nowrap">
            S'inscrire
          </a>
        </ng-template>
      </div>

      <!-- Menu mobile -->
      <button class="md:tw-hidden tw-text-gray-600 hover:tw-text-gray-900">
        <i class="ri-menu-line tw-text-2xl"></i>
      </button>
    </div>
  </div>
</header>
