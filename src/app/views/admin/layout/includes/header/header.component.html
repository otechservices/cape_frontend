<div class="tw-bg-white tw-border-b tw-border-gray-200 tw-px-6 tw-py-4">
  <div class="tw-flex tw-items-center tw-justify-between">
    <!-- Titre -->
    <div class="tw-flex tw-items-center tw-gap-4">
      <h1 class="tw-text-xl tw-font-semibold tw-text-gray-900">
        Tableau de bord
      </h1>
    </div>

    <!-- Barre recherche + actions -->
    <div class="tw-flex tw-items-center tw-gap-4">
      <!-- Recherche -->
      <div class="tw-w-80">
        <div class="tw-relative">
          <i class="ri-search-line tw-absolute tw-left-3 tw-top-1/2 -tw-translate-y-1/2 tw-text-gray-400"></i>
          <input
            type="text"
            placeholder="Rechercher un centre, rapport..."
            [(ngModel)]="searchQuery"
            class="tw-w-full tw-pl-10 tw-pr-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg focus:tw-outline-none focus:tw-ring-1 focus:tw-ring-blue-500"
          />
        </div>
      </div>

      <!-- Notifications + User menu -->
      <div class="tw-flex tw-items-center tw-gap-2">
        <!-- Notifications -->
        <button
          class="tw-flex tw-items-center tw-justify-center tw-w-8 tw-h-8 tw-rounded-lg hover:tw-bg-gray-100"
        >
          <i class="ri-notification-line"></i>
        </button>

        <!-- Menu utilisateur -->
        <div class="tw-relative">
          <button
            (click)="toggleUserMenu()"
            class="tw-flex tw-items-center tw-gap-2 tw-px-3 tw-py-2 tw-rounded-lg hover:tw-bg-gray-100 tw-transition-colors tw-cursor-pointer"
          >
            <div
              class="tw-w-8 tw-h-8 tw-bg-blue-600 tw-rounded-full tw-flex tw-items-center tw-justify-center"
            >
              <span class="tw-text-white tw-text-sm tw-font-medium">U</span>
            </div>
            <span class="tw-text-sm tw-font-medium tw-text-gray-700">Utilisateur</span>
            <div class="tw-w-4 tw-h-4 tw-flex tw-items-center tw-justify-center">
              <i class="ri-arrow-down-s-line tw-text-xs tw-text-gray-500"></i>
            </div>
          </button>

          <!-- Dropdown -->
          <div
            *ngIf="showUserMenu"
            class="tw-absolute tw-right-0 tw-mt-2 tw-w-48 tw-bg-white tw-rounded-lg tw-shadow-lg tw-border tw-border-gray-200 tw-py-2 tw-z-50"
          >
            <button
              class="tw-w-full tw-px-4 tw-py-2 tw-text-left tw-text-sm tw-text-gray-700 hover:tw-bg-gray-100 tw-cursor-pointer"
            >
              Profil
            </button>
            <button
              class="tw-w-full tw-px-4 tw-py-2 tw-text-left tw-text-sm tw-text-gray-700 hover:tw-bg-gray-100 tw-cursor-pointer"
            >
              Paramètres
            </button>
            <hr class="tw-my-2" />
            <button
              (click)="handleLogout()"
              class="tw-w-full tw-px-4 tw-py-2 tw-text-left tw-text-sm tw-text-gray-700 hover:tw-bg-gray-100 tw-cursor-pointer"
            >
              Déconnexion
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
