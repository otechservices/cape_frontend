<div class="tw-bg-white tw-rounded-xl tw-shadow-sm tw-border tw-border-gray-200">
  <div class="tw-flex tw-items-center tw-gap-3 tw-px-5 tw-py-4 tw-border-b tw-border-gray-100">
    <div class="tw-ml-auto tw-flex tw-items-center tw-gap-3">
      <span class="tw-text-sm tw-text-gray-500">{{ filteredData.length }} / {{ data.length }} élément(s)</span>
      <div class="tw-relative">
        <span class="tw-absolute tw-inset-y-0 tw-left-0 tw-flex tw-items-center tw-pl-3 tw-text-gray-400">
          <i class="bx bx-search"></i>
        </span>
        <input type="text"
          class="tw-pl-9 tw-pr-3 tw-py-1.5 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-outline-none focus:tw-border-blue-400 tw-w-64"
          placeholder="Rechercher..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="currentPage = 1" />
      </div>
    </div>
  </div>

  <div class="tw-overflow-x-auto">
    <table class="tw-min-w-full">
      <thead>
        <tr class="tw-bg-gray-50 tw-border-b tw-border-gray-200">
          <th class="tw-w-10 tw-px-2 tw-py-3"></th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Identité</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Email</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Contact</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Fonction</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Message</th>
        </tr>
      </thead>
      <tbody class="tw-divide-y tw-divide-gray-100">
        <tr *ngFor="let d of data | sampleSearch:searchTerm | paginate:currentPage:pageSize"
          (click)="checked(d)"
          class="tw-cursor-pointer tw-transition-colors"
          [ngClass]="selected_data?.id === d.id ? 'tw-bg-blue-50 hover:tw-bg-blue-100' : 'hover:tw-bg-gray-50'">
          <td class="tw-px-2 tw-py-3">
            <div class="tw-w-4 tw-h-4 tw-rounded-full tw-border-2 tw-flex tw-items-center tw-justify-center tw-flex-shrink-0"
              [ngClass]="selected_data?.id === d.id ? 'tw-border-blue-600 tw-bg-blue-600' : 'tw-border-gray-300 tw-bg-white'">
              <div *ngIf="selected_data?.id === d.id" class="tw-w-1.5 tw-h-1.5 tw-rounded-full tw-bg-white"></div>
            </div>
          </td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-900">{{ d.name }}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-600">{{ d.email }}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-600">{{ d.phone }}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-600">{{ d.service }}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-600">{{ d.observation }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="tw-border-t tw-border-gray-100 tw-px-5 tw-py-3">
    <app-pagination
      [totalItems]="filteredData.length"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (pageChange)="currentPage = $event"
      (pageSizeChange)="pageSize = $event; currentPage = 1">
    </app-pagination>
  </div>
</div>
