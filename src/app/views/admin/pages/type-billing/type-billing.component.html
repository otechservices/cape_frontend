<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-5">
    <div class="breadcrumb-title pe-3">CAPE </div>
    <div class="ps-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 p-0">
          <li class="breadcrumb-item"><a routerLink="/admin/dashboard"><i class="bx bx-home-alt"></i></a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Liste des types d'assitance</li>
        </ol>
      </nav>
    </div>
    <div class="ms-auto">
    </div>
  </div>

  <div class="tw-grid tw-grid-cols-12 tw-gap-4">
     <div class="tw-col-span-12">
       <div class="tw-bg-white tw-rounded-lg tw-shadow">
          
              <div class="tw-p-6">
                 <div class="tw-flex tw-mb-5" *ngIf="buttonsPermission">
                  <button type="button" class="tw-bg-blue-600 tw-text-white tw-text-sm tw-px-3 tw-py-1 tw-rounded hover:tw-bg-blue-700 tw-me-3" (click)="add(addContent)">Ajouter un type d'assistance</button>

                    <button *ngIf="buttonsPermission.show"  (click)="show(showContent)" type="button" class="tw-border tw-border-blue-500 tw-text-blue-500 tw-text-sm tw-px-3 tw-py-1 tw-rounded hover:tw-bg-blue-50 tw-me-3">
                         <span>Consulter</span></button>
                    <button *ngIf="buttonsPermission.edit" (click)="edit(editContent)" type="button"  class="tw-border tw-border-yellow-500 tw-text-yellow-500 tw-text-sm tw-px-3 tw-py-1 tw-rounded hover:tw-bg-yellow-50 tw-me-3">
                       Editer</button>
                    <button *ngIf="buttonsPermission.delete" (click)="delete()" type="button" class="tw-border tw-border-red-500 tw-text-red-500 tw-text-sm tw-px-3 tw-py-1 tw-rounded hover:tw-bg-red-50 tw-me-3">
                         Supprimer</button>
                   
                </div>

                        <p>{{data.length}} élément(s)</p>
                        <div class="tw-overflow-x-auto">
                        <table class="tw-min-w-full tw-border tw-border-gray-200 tw-text-sm">
                            <thead class="tw-bg-gray-100">
                                <tr>
                                    <th class="tw-w-[40px] tw-px-3 tw-py-2">#</th>
                                    <th class="tw-px-3 tw-py-2">Libellé</th>

                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let d of data" class="tw-border-t">
                                     <td class="tw-px-3 tw-py-2">
                                        <div class="tw-form-check tw-mb-2">
                                            <input
                      type="radio"
                      name="flexRadioDefault"
                      id="flexRadioDefault{{d.id}}"
                      class="tw-form-radio tw-text-blue-600"
                      (click)="checked(d)"
                    />
                                        
                                        </div>
                                    </td>
                                     <td class="tw-px-3 tw-py-2">{{d.name}}</td>
                           
                                   
                                </tr>
                            
                            </tbody>
                        </table>
                        </div>

            </div><!-- end card -->
        </div>
        <!-- end col -->
    </div>
    <!-- end col -->
</div>

<ng-template #addContent let-c="close" let-d="dismiss">
    <form #addForm="ngForm" (ngSubmit)="store(addForm.value)">
    <div class="modal-header bg-secondary">
      <h6 class="modal-title text-white" id="modal-basic-title">Enregistrer un type de info</h6>
      <button type="button" class="btn-close" aria-label="Close" (click)="d('Cross click')"></button>
    </div>
    <div class="modal-body" >
        <div class="row mb-3" >
      
            <div class=" form-goup col-12 mb-3">
                <label for="">Libellé <span class="text-danger ml-2">(*)</span></label>
                <input type="text" name="name" class="form-control" ngModel required>
            </div>

        </div>
       
    </div>
    <div class="modal-footer">
      <button type="submit" class="btn btn-outline-dark" [disabled]="addForm.invalid"  >Enregistrer <app-loading [isVisible]="loading"></app-loading></button>
    </div>
</form>
  </ng-template>

  <ng-template #editContent let-c="close" let-d="dismiss">
    <form #editForm="ngForm" (ngSubmit)="update(editForm.value)">
    <div class="modal-header">
      <h6 class="modal-title text-white" id="modal-basic-title">Modifier un type de info</h6>
      <button type="button" class="btn-close" aria-label="Close" (click)="d('Cross click')"></button>
    </div>
    <div class="modal-body" >
        <div class="row mb-3">
        
            <div class=" form-goup col-12 mb-3">
                <label for="">Libellé <span class="text-danger ml-2">(*)</span></label>
                <input type="text" name="name" class="form-control" [(ngModel)]="selected_data.name" required>
            </div> 
         
          
        </div>
       
    </div>
    <div class="modal-footer">
      <button type="submit" class="btn btn-outline-dark" [disabled]="editForm.invalid" >Sauvegarder <app-loading [isVisible]="loading"></app-loading></button>
    </div>
</form>
  </ng-template>

  <ng-template #showContent let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title text-white" id="modal-basic-title">Détails des informations</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="d('Cross click')"></button>
      </div>

      <div class="modal-body">
        <div class="tw-overflow-x-auto table-card">
            <table class="table table-borderless align-middle mb-0">
                <tbody>
                  
               
                    <tr >
                        <td class="fw-medium">Libellé</td>
                        <td >{{selected_data.name}} </td>
                      
                    </tr>
               
               
            
               
                </tbody>
            </table>
        </div>
      </div>
</ng-template>
