<div class="tw-bg-white tw-rounded-xl tw-shadow-sm tw-border tw-border-gray-200">
  <!-- Toolbar -->
  <div class="tw-flex tw-items-center tw-gap-2 tw-px-5 tw-py-4 tw-border-b tw-border-gray-100" *ngIf="buttonsPermission">
    <button type="button" (click)="add(addContent)"
      class="tw-inline-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-lg tw-text-sm tw-font-medium tw-bg-blue-600 tw-text-white hover:tw-bg-blue-700 tw-transition-colors">
      <i class="ri-add-line"></i> Ajouter
    </button>
    <button *ngIf="buttonsPermission.show" (click)="show(showContent)" type="button" [disabled]="!selected_data"
      class="tw-inline-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-lg tw-text-sm tw-font-medium tw-transition-colors"
      [ngClass]="selected_data ? 'tw-border tw-border-blue-500 tw-text-blue-600 hover:tw-bg-blue-50' : 'tw-bg-gray-100 tw-text-gray-400 tw-cursor-not-allowed'">
      <i class="ri-eye-line"></i> Consulter
    </button>
    <button *ngIf="buttonsPermission.edit" (click)="edit(editContent)" type="button" [disabled]="!selected_data"
      class="tw-inline-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-lg tw-text-sm tw-font-medium tw-transition-colors"
      [ngClass]="selected_data ? 'tw-border tw-border-yellow-500 tw-text-yellow-600 hover:tw-bg-yellow-50' : 'tw-bg-gray-100 tw-text-gray-400 tw-cursor-not-allowed'">
      <i class="ri-pencil-line"></i> Éditer
    </button>
    <button *ngIf="buttonsPermission.delete" (click)="delete()" type="button" [disabled]="!selected_data"
      class="tw-inline-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-lg tw-text-sm tw-font-medium tw-transition-colors"
      [ngClass]="selected_data ? 'tw-border tw-border-red-500 tw-text-red-600 hover:tw-bg-red-50' : 'tw-bg-gray-100 tw-text-gray-400 tw-cursor-not-allowed'">
      <i class="ri-delete-bin-line"></i> Supprimer
    </button>
    <button *ngIf="is_active!=null && !is_active" (click)="setStatus(1)" type="button"
      class="tw-inline-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-lg tw-text-sm tw-font-medium tw-border tw-border-green-500 tw-text-green-600 hover:tw-bg-green-50 tw-transition-colors">
      <i class="ri-checkbox-circle-line"></i> Activer
    </button>
    <button *ngIf="is_active!=null && is_active" (click)="setStatus(0)" type="button"
      class="tw-inline-flex tw-items-center tw-gap-1.5 tw-px-3 tw-py-1.5 tw-rounded-lg tw-text-sm tw-font-medium tw-border tw-border-orange-400 tw-text-orange-600 hover:tw-bg-orange-50 tw-transition-colors">
      <i class="ri-indeterminate-circle-line"></i> Désactiver
    </button>
    <div class="tw-flex-1"></div>
    <span class="tw-text-sm tw-text-gray-500">{{ filteredData.length }} / {{ data.length }}</span>
    <div class="tw-relative">
      <i class="ri-search-line tw-absolute tw-left-3 tw-top-1/2 -tw-translate-y-1/2 tw-text-gray-400 tw-text-sm"></i>
      <input type="text" class="tw-pl-9 tw-pr-3 tw-py-1.5 tw-w-64 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-outline-none focus:tw-ring-1 focus:tw-ring-blue-500" placeholder="Rechercher..." [(ngModel)]="searchTerm" (ngModelChange)="currentPage = 1" />
    </div>
  </div>
  <!-- Table -->
  <div class="tw-overflow-x-auto">
    <table class="tw-min-w-full tw-text-sm">
      <thead>
        <tr class="tw-bg-gray-50 tw-border-b tw-border-gray-200">
          <th class="tw-w-10 tw-px-2 tw-py-3"></th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Libellé</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Commune</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Statut</th>
        </tr>
      </thead>
      <tbody class="tw-divide-y tw-divide-gray-100">
        <tr *ngFor="let d of data | sampleSearch:searchTerm | paginate:currentPage:pageSize"
            (click)="checked(d)"
            class="tw-cursor-pointer tw-transition-colors"
            [ngClass]="selected_data?.id === d.id ? 'tw-bg-blue-50 hover:tw-bg-blue-100' : 'hover:tw-bg-gray-50'">
          <td class="tw-px-2 tw-py-3">
            <div class="tw-w-4 tw-h-4 tw-rounded-full tw-border-2 tw-flex tw-items-center tw-justify-center tw-transition-all tw-flex-shrink-0"
                 [ngClass]="selected_data?.id === d.id ? 'tw-border-blue-600 tw-bg-blue-600' : 'tw-border-gray-300 tw-bg-white'">
              <div *ngIf="selected_data?.id === d.id" class="tw-w-1.5 tw-h-1.5 tw-rounded-full tw-bg-white"></div>
            </div>
          </td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-900">{{d.name}}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-900">{{d.municipality?.name ??"Non défini"}}</td>
          <td class="tw-px-4 tw-py-3">
            <span *ngIf="d.is_active" class="tw-inline-flex tw-items-center tw-px-2 tw-py-0.5 tw-rounded-full tw-text-xs tw-font-medium tw-bg-green-100 tw-text-green-700">Actif</span>
            <span *ngIf="!d.is_active" class="tw-inline-flex tw-items-center tw-px-2 tw-py-0.5 tw-rounded-full tw-text-xs tw-font-medium tw-bg-red-100 tw-text-red-700">Bloqué</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- Pagination -->
  <div class="tw-border-t tw-border-gray-100 tw-px-5 tw-py-3">
    <app-pagination
      [totalItems]="filteredData.length"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (pageChange)="currentPage = $event"
      (pageSizeChange)="pageSize = $event; currentPage = 1">
    </app-pagination>
  </div>
</div>

<ng-template #addContent let-c="close" let-d="dismiss">
  <form #addForm="ngForm" (ngSubmit)="store(addForm.value)">
    <div class="modal-header tw-bg-slate-800 tw-text-white">
      <h6 class="modal-title tw-font-semibold">Enregistrer un arrondissement</h6>
      <button type="button" (click)="d('Cross click')" class="tw-text-white hover:tw-text-gray-200 tw-transition-colors">
        <i class="ri-close-line tw-text-lg"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="row mb-3">
        <div class="form-goup col-12 mb-3">
          <label for="">Commune <span class="text-danger ml-2">(*)</span></label>
          <select name="municipality_id" class="form-control" ngModel required>
            <option *ngFor="let s of municipalities" [value]="s.id">{{s.name}}</option>
          </select>
        </div>
        <div class="form-goup col-12 mb-3">
          <label for="">Libellé <span class="text-danger ml-2">(*)</span></label>
          <input type="text" name="name" class="form-control" ngModel required>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="submit" class="btn btn-outline-dark" [disabled]="addForm.invalid">Enregistrer <app-loading [isVisible]="loading"></app-loading></button>
    </div>
  </form>
</ng-template>

<ng-template #editContent let-c="close" let-d="dismiss">
  <form #editForm="ngForm" (ngSubmit)="update(editForm.value)">
    <div class="modal-header tw-bg-slate-800 tw-text-white">
      <h6 class="modal-title tw-font-semibold">Modifier un arrondissement</h6>
      <button type="button" (click)="d('Cross click')" class="tw-text-white hover:tw-text-gray-200 tw-transition-colors">
        <i class="ri-close-line tw-text-lg"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="row mb-3">
        <div class="form-goup col-12 mb-3">
          <label for="">Ville <span class="text-danger ml-2">(*)</span></label>
          <select name="municipality_id" class="form-control" [(ngModel)]="selected_data.municipality_id" required>
            <option *ngFor="let s of municipalities" [value]="s.id">{{s.name}}</option>
          </select>
        </div>
        <div class="form-goup col-12 mb-3">
          <label for="">Libellé <span class="text-danger ml-2">(*)</span></label>
          <input type="text" name="name" class="form-control" [(ngModel)]="selected_data.name" required>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="submit" class="btn btn-outline-dark" [disabled]="editForm.invalid">Sauvegarder <app-loading [isVisible]="loading"></app-loading></button>
    </div>
  </form>
</ng-template>

<ng-template #showContent let-c="close" let-d="dismiss">
  <div class="modal-header tw-bg-slate-800 tw-text-white">
    <h6 class="modal-title tw-font-semibold">Détails des informations</h6>
    <button type="button" (click)="d('Cross click')" class="tw-text-white hover:tw-text-gray-200 tw-transition-colors">
      <i class="ri-close-line tw-text-lg"></i>
    </button>
  </div>
  <div class="modal-body">
    <div class="tw-overflow-x-auto table-card">
      <table class="table table-borderless align-middle mb-0">
        <tbody>
          <tr>
            <td class="fw-medium">Ville</td>
            <td>{{selected_data.city.name}}</td>
          </tr>
          <tr>
            <td class="fw-medium">Arrondissement</td>
            <td>{{selected_data.name}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</ng-template>
