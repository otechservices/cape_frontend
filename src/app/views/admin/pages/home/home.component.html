<div class="tw-bg-gray-50">

  <div class="tw-p-6 tw-space-y-6">
    <!-- Cartes statistiques -->
    <div class="tw-grid tw-grid-cols-1 md:tw-grid-cols-5 tw-gap-4">
      <div
        *ngFor="let card of statsCards"
        class="tw-rounded-lg tw-p-6 tw-cursor-pointer hover:tw-opacity-90 tw-transition-opacity"
        [ngClass]="[card.bgColor, card.textColor]"
        (click)="navigate(card.path)"
      >
        <div class="tw-text-2xl tw-font-bold tw-mb-2">{{ card.value }}</div>
        <div class="tw-text-sm tw-opacity-90">{{ card.title }}</div>
        <div class="tw-mt-3 tw-text-right">
          <span class="tw-text-xs tw-underline">Voir plus</span>
        </div>
      </div>
    </div>
    <div class="tw-grid tw-grid-cols-1 lg:tw-grid-cols-2 tw-gap-6">
      <!-- Activités récentes -->
      <div class="tw-bg-white tw-rounded-lg tw-shadow tw-p-4">
        <h2 class="tw-font-semibold tw-text-gray-800 tw-mb-4">Activités récentes</h2>
        <div class="tw-space-y-4">
          <div
            *ngFor="let activite of activitesRecentes"
            class="tw-flex tw-items-start tw-gap-3 tw-p-3 hover:tw-bg-gray-50 tw-rounded-lg tw-transition-colors"
          >
            <div class="tw-w-8 tw-h-8 tw-flex tw-items-center tw-justify-center tw-rounded-full tw-bg-gray-100"
                 [ngClass]="activite.iconColor">
              <i [class]="activite.icon"></i>
            </div>
            <div class="tw-flex-1">
              <div class="tw-font-medium tw-text-gray-900">{{ activite.type }}</div>
              <div class="tw-text-sm tw-text-gray-600">{{ activite.description }}</div>
              <div class="tw-text-xs tw-text-gray-400 tw-mt-1">{{ activite.heure }}</div>
            </div>
          </div>
        </div>
        <div class="tw-mt-4 tw-pt-4 tw-border-t">
          <button class="tw-w-full tw-border tw-rounded tw-px-3 tw-py-2 tw-text-sm tw-text-gray-700 hover:tw-bg-gray-100">
            Voir toutes les activités
          </button>
        </div>
      </div>

      <!-- Actions rapides -->
      <div class="tw-bg-white tw-rounded-lg tw-shadow tw-p-4">
        <h2 class="tw-font-semibold tw-text-gray-800 tw-mb-4">Actions rapides</h2>
        <div class="tw-grid tw-grid-cols-2 tw-gap-4">
          <button
            *ngFor="let action of actionsRapides"
            (click)="navigate(action.path)"
            class="tw-p-4 tw-border tw-border-gray-200 tw-rounded-lg hover:tw-bg-blue-50 hover:tw-border-blue-300 tw-transition-colors tw-text-center"
          >
            <div class="tw-w-8 tw-h-8 tw-flex tw-items-center tw-justify-center tw-mx-auto tw-mb-2 tw-text-blue-600">
              <i [class]="action.icon"></i>
            </div>
            <div class="tw-text-sm tw-font-medium tw-text-gray-700">{{ action.title }}</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="tw-text-center tw-text-sm tw-text-gray-500 tw-pt-8">
      Copyright 2020
    </div>
  </div>
</div>
