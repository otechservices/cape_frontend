  <div class="tw-grid tw-grid-cols-12 tw-gap-4">
  <div class="tw-col-span-12">
    <div class="tw-bg-white tw-rounded-lg tw-shadow">
      <!-- Card Header -->
      <div class="tw-p-4 tw-border-b tw-border-gray-200">
        <button
          type="button"
          [disabled]="loading"
          (click)="store()"
          class="tw-bg-blue-600 tw-text-white tw-text-sm tw-px-3 tw-py-1 tw-rounded hover:tw-bg-blue-700 tw-me-3 disabled:tw-bg-gray-300 disabled:tw-cursor-not-allowed"
        >
          Créer une sauvegarde
        </button>
      </div>

      <!-- Card Body -->
      <div class="tw-p-6">
        <div class="tw-flex tw-items-center tw-justify-between tw-mb-3">
          <p class="tw-text-sm tw-text-gray-500 tw-mb-0">
            {{ filteredData.length }} / {{ data.length }} élément(s)
          </p>
          <div class="tw-relative tw-w-72">
            <span class="tw-absolute tw-inset-y-0 tw-left-0 tw-flex tw-items-center tw-pl-3 tw-text-gray-400">
              <i class="bx bx-search"></i>
            </span>
            <input
              type="text"
              class="tw-w-full tw-pl-9 tw-pr-3 tw-py-1.5 tw-border tw-border-gray-300 tw-rounded tw-text-sm focus:tw-outline-none focus:tw-border-blue-400"
              placeholder="Rechercher..."
              [(ngModel)]="searchTerm"
              (ngModelChange)="currentPage = 1"
            />
          </div>
        </div>

        <!-- Table -->
        <div class="tw-overflow-x-auto">
          <table class="tw-min-w-full tw-border tw-border-gray-200 tw-text-sm">
            <thead class="tw-bg-gray-100">
              <tr>
                <th class="tw-w-[40px] tw-px-3 tw-py-2">#</th>
                <th class="tw-px-3 tw-py-2">Libellé</th>
                <th class="tw-px-3 tw-py-2">Date</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let d of data | sampleSearch:searchTerm | paginate:currentPage:pageSize; let i = index" class="tw-border-t">
                <td class="tw-px-3 tw-py-2">{{ i + 1 }}</td>
                <td class="tw-px-3 tw-py-2">{{ d.name }}</td>
                <td class="tw-px-3 tw-py-2">{{ d.created_at | date: 'shortDate' }}</td>
              </tr>
            </tbody>
          </table>
        </div>
<app-pagination
  [totalItems]="filteredData.length"
  [currentPage]="currentPage"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 25, 50]"
  (pageChange)="currentPage = $event"
  (pageSizeChange)="pageSize = $event; currentPage = 1">
</app-pagination>
      </div>
      <!-- end card-body -->
    </div>
    <!-- end card -->
  </div>
  <!-- end col -->
</div>
