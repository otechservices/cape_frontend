 <div class="tw-grid tw-grid-cols-12 tw-gap-4">
  <div class="tw-col-span-12">
    <div class="tw-bg-white tw-rounded-lg tw-shadow">
      <div class="tw-p-6">
        <!-- Nombre d'éléments -->
        <p>{{ data.length }} élément(s)</p>

        <!-- Table -->
        <div class="tw-overflow-x-auto">
          <table class="tw-min-w-full tw-border tw-border-gray-200 tw-text-sm">
            <thead class="tw-bg-gray-100">
              <tr>
                <th class="tw-w-[40px] tw-px-3 tw-py-2">#</th>
                <th class="tw-px-3 tw-py-2">Description</th>
                <th class="tw-px-3 tw-py-2">Table affectée</th>
                <th class="tw-px-3 tw-py-2">Auteur</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let d of data; let i = index" class="tw-border-t">
                <td class="tw-px-3 tw-py-2">{{ i + 1 }}</td>
                <td class="tw-px-3 tw-py-2">{{ d.description }}</td>
                <td class="tw-px-3 tw-py-2">{{ d.causer_type }}</td>
                <td class="tw-px-3 tw-py-2">{{ d.name }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- end card-body -->
    </div>
    <!-- end card -->
  </div>
  <!-- end col -->
</div>

    
    <ng-template #addContent let-c="close" let-d="dismiss">
        <form #addForm="ngForm" (ngSubmit)="store(addForm.value)">
        <div class="modal-header bg-secondary">
          <h6 class="modal-title text-white" id="modal-basic-title">Enregistrer un département</h6>
          <button type="button" class="btn-close" aria-label="Close" (click)="d('Cross click')"></button>
        </div>
        <div class="modal-body" >
            <div class="row mb-3" >
          
                <div class=" form-goup col-12 mb-3">
                    <label for="">Libellé <span class="text-danger ml-2">(*)</span></label>
                    <input type="text" name="name" class="form-control" ngModel required>
                </div>
    
            </div>
           
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-outline-dark" [disabled]="addForm.invalid"  >Enregistrer <app-loading [isVisible]="loading"></app-loading></button>
        </div>
    </form>
      </ng-template>
    
      <ng-template #editContent let-c="close" let-d="dismiss">
        <form #editForm="ngForm" (ngSubmit)="update(editForm.value)">
        <div class="modal-header">
          <h6 class="modal-title text-white" id="modal-basic-title">Modifier un département</h6>
          <button type="button" class="btn-close" aria-label="Close" (click)="d('Cross click')"></button>
        </div>
        <div class="modal-body" >
            <div class="row mb-3">
            
                <div class=" form-goup col-12 mb-3">
                    <label for="">Libellé <span class="text-danger ml-2">(*)</span></label>
                    <input type="text" name="name" class="form-control" [(ngModel)]="selected_data.name" required>
                </div> 
             
              
            </div>
           
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-outline-dark" [disabled]="editForm.invalid" >Sauvegarder <app-loading [isVisible]="loading"></app-loading></button>
        </div>
    </form>
      </ng-template>
    
      <ng-template #showContent let-c="close" let-d="dismiss">
        <div class="modal-header">
            <h4 class="modal-title text-white" id="modal-basic-title">Détails des informations</h4>
            <button type="button" class="btn-close" aria-label="Close" (click)="d('Cross click')"></button>
          </div>
    
          <div class="modal-body">
            <div class="tw-overflow-x-auto table-card">
                <table class="table table-borderless align-middle mb-0">
                    <tbody>
                      
                   
                        <tr >
                            <td class="fw-medium">Libellé</td>
                            <td >{{selected_data.name}} </td>
                          
                        </tr>
                   
                   
                
                   
                    </tbody>
                </table>
            </div>
          </div>
    </ng-template>
