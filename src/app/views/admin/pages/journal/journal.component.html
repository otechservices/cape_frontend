<div class="tw-bg-white tw-rounded-xl tw-shadow-sm tw-border tw-border-gray-200">
  <!-- Toolbar -->
  <div class="tw-flex tw-items-center tw-gap-2 tw-px-5 tw-py-4 tw-border-b tw-border-gray-100">
    <div class="tw-flex-1"></div>
    <span class="tw-text-sm tw-text-gray-500">{{ filteredData.length }} / {{ data.length }}</span>
    <div class="tw-relative">
      <i class="ri-search-line tw-absolute tw-left-3 tw-top-1/2 -tw-translate-y-1/2 tw-text-gray-400 tw-text-sm"></i>
      <input type="text"
        class="tw-pl-9 tw-pr-3 tw-py-1.5 tw-w-64 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-outline-none focus:tw-ring-1 focus:tw-ring-blue-500"
        placeholder="Rechercher..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="currentPage = 1" />
    </div>
  </div>

  <div class="tw-overflow-x-auto">
    <table class="tw-min-w-full tw-text-sm">
      <thead>
        <tr class="tw-bg-gray-50 tw-border-b tw-border-gray-200">
          <th class="tw-w-10 tw-px-2 tw-py-3"></th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Description</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Table affectée</th>
          <th class="tw-px-4 tw-py-3 tw-text-left tw-text-xs tw-font-semibold tw-text-gray-500 tw-uppercase tw-tracking-wide">Auteur</th>
        </tr>
      </thead>
      <tbody class="tw-divide-y tw-divide-gray-100">
        <tr *ngFor="let d of data | sampleSearch:searchTerm | paginate:currentPage:pageSize; let i = index"
            class="tw-transition-colors hover:tw-bg-gray-50">
          <td class="tw-px-2 tw-py-3 tw-text-gray-400 tw-text-xs">{{ i + 1 }}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-900">{{ d.description }}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-900">{{ d.causer_type }}</td>
          <td class="tw-px-4 tw-py-3 tw-text-gray-900">{{ d.name }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="tw-border-t tw-border-gray-100 tw-px-5 tw-py-3">
    <app-pagination
      [totalItems]="filteredData.length"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (pageChange)="currentPage = $event"
      (pageSizeChange)="pageSize = $event; currentPage = 1">
    </app-pagination>
  </div>
</div>
