<div class="tw-w-full tw-max-w-md tw-space-y-8">

  <div class="tw-text-center">
    <div class="tw-flex tw-justify-center tw-mb-6">
      <img
        src="assets/template2/images/masm.png"
        alt="logo-masm"
        class="tw-h-16"
      />
    </div>
    <h1 class="tw-text-lg tw-font-medium tw-text-teal-700 tw-leading-tight">
      Plateforme de gestion des centres d'accueil et de protection de l'enfant en République du Bénin
    </h1>
  </div>

  <div class="tw-bg-white tw-p-8 tw-rounded-lg tw-shadow-sm tw-border">

    <div class="tw-flex tw-items-center tw-gap-3 tw-mb-6">
      <div class="tw-w-10 tw-h-10 tw-bg-orange-100 tw-rounded-full tw-flex tw-items-center tw-justify-center tw-shrink-0">
        <i class="bx bx-key tw-text-orange-600 tw-text-xl"></i>
      </div>
      <div>
        <h2 class="tw-text-base tw-font-semibold tw-text-gray-800">Première connexion</h2>
        <p class="tw-text-sm tw-text-gray-500">Veuillez définir votre mot de passe personnel.</p>
      </div>
    </div>

    <form #fpForm="ngForm" (ngSubmit)="changeFirstPassword(fpForm.value)" class="tw-space-y-4">

      <div>
        <label class="tw-block tw-text-sm tw-text-gray-600 tw-mb-2">
          Nouveau mot de passe <span class="tw-text-red-500">*</span>
        </label>
        <div class="tw-relative">
          <div class="tw-absolute tw-inset-y-0 tw-left-0 tw-pl-3 tw-flex tw-items-center tw-pointer-events-none">
            <i class="fas fa-lock tw-text-gray-400 tw-text-sm"></i>
          </div>
          <input
            type="password"
            name="password"
            placeholder="Nouveau mot de passe"
            class="tw-w-full tw-pl-10 tw-pr-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-outline-none focus:tw-ring-2 focus:tw-ring-blue-500"
            ngModel
            required
            minlength="8"
          />
        </div>
      </div>

      <div>
        <label class="tw-block tw-text-sm tw-text-gray-600 tw-mb-2">
          Confirmer le mot de passe <span class="tw-text-red-500">*</span>
        </label>
        <div class="tw-relative">
          <div class="tw-absolute tw-inset-y-0 tw-left-0 tw-pl-3 tw-flex tw-items-center tw-pointer-events-none">
            <i class="fas fa-lock tw-text-gray-400 tw-text-sm"></i>
          </div>
          <input
            type="password"
            name="password_confirmation"
            placeholder="Confirmer le mot de passe"
            class="tw-w-full tw-pl-10 tw-pr-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-text-sm focus:tw-outline-none focus:tw-ring-2 focus:tw-ring-blue-500"
            ngModel
            required
            minlength="8"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="fpForm.invalid || loading"
        class="tw-w-full tw-bg-blue-800 hover:tw-bg-blue-900 disabled:tw-bg-gray-400 disabled:tw-cursor-not-allowed tw-text-white tw-rounded tw-px-4 tw-py-2 tw-text-sm tw-flex tw-items-center tw-justify-center tw-gap-2"
      >
        <ng-container *ngIf="loading">
          <div class="tw-animate-spin tw-rounded-full tw-h-4 tw-w-4 tw-border-b-2 tw-border-white"></div>
          <span>Enregistrement...</span>
        </ng-container>
        <ng-container *ngIf="!loading">
          <span>Définir mon mot de passe</span>
        </ng-container>
      </button>

    </form>
  </div>

  <div class="tw-text-center tw-text-xs tw-text-gray-500">
    <p>© 2024 République du Bénin - Tous droits réservés</p>
  </div>

</div>
