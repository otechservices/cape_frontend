     <div class="w-full max-w-md space-y-8">
          <div class="text-center">
            <div class="flex justify-center mb-6">
              <img 
                src="assets/template2/images/masm.png"
                alt="logo-masm"
                class="h-16"
              />
            </div>
          </div>

          <div class="text-center">
            <h1 class="text-lg font-medium text-teal-700 leading-tight">
              Plateforme de gestion des centres d'accueil et de protection de l'enfant en République du Bénin
            </h1>
          </div>

        <div class="bg-white p-8 rounded-lg shadow-sm border">

           <form [formGroup]="authForm" (ngSubmit)="login()" class="space-y-4">

              <!-- Champ email -->
              <div>
                <label class="block text-sm text-gray-600 mb-2">
                  Veuillez vous connecter à votre espace de traitement *
                </label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-envelope text-gray-400 text-sm"></i>
                  </div>
                  <input
                    type="email"
                    formControlName="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm pl-10"
                    placeholder="Adresse email"
                  />
                </div>
                <div *ngIf="authForm.get('email')?.invalid && authForm.get('email')?.touched" class="text-red-500 text-sm">
                  Email invalide
                </div>
              </div>

              <!-- Champ mot de passe -->
              <div>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-lock text-gray-400 text-sm"></i>
                  </div>
                  <input
                    type="password"
                    formControlName="password"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm pl-10"
                    placeholder="Mot de passe"
                  />
                </div>
                <div *ngIf="authForm.get('password')?.invalid && authForm.get('password')?.touched" class="text-red-500 text-sm">
                  Mot de passe requis
                </div>
              </div>

              <!-- Bouton -->
              <button
                type="submit"
                [disabled]="isLoading || authForm.invalid"
                class="w-full bg-blue-800 hover:bg-blue-900 text-white rounded px-4 py-2"
              >
                <ng-container *ngIf="isLoading; else normalBtn">
                  <div class="flex items-center justify-center">
                    <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
                    Connexion...
                  </div>
                </ng-container>
                <ng-template #normalBtn>
                  Connexion
                </ng-template>
              </button>

      <!-- Mot de passe oublié -->
            <div class="text-center">
              <a href="#" class="text-sm text-blue-600 hover:text-blue-800 underline">
                Mot de passe oublié
              </a>
            </div>
      </form>

        </div>


          <div class="text-center text-xs text-gray-500">
            <p>© 2024 République du Bénin - Tous droits réservés</p>
          </div>
        </div>
