<div class="tw-w-full tw-max-w-md tw-space-y-8">
  <div class="tw-text-center">
    <div class="tw-flex tw-justify-center tw-mb-6">
      <img 
        src="assets/template2/images/masm.png"
        alt="logo-masm"
        class="tw-h-16"
      />
    </div>
  </div>

  <div class="tw-text-center">
    <h1 class="tw-text-lg tw-font-medium tw-text-teal-700 tw-leading-tight">
      Plateforme de gestion des centres d'accueil et de protection de l'enfant en République du Bénin
    </h1>
  </div>

  <div class="tw-bg-white tw-p-8 tw-rounded-lg tw-shadow-sm tw-border">

    <form [formGroup]="authForm" (ngSubmit)="login()" class="tw-space-y-4">

      <!-- Champ email -->
      <div>
        <label class="tw-block tw-text-sm tw-text-gray-600 tw-mb-2">
          Veuillez vous connecter à votre espace de traitement *
        </label>
        <div class="tw-relative">
          <div class="tw-absolute tw-inset-y-0 tw-left-0 tw-pl-3 tw-flex tw-items-center tw-pointer-events-none">
            <i class="fas fa-envelope tw-text-gray-400 tw-text-sm"></i>
          </div>
          <input
            type="email"
            formControlName="email"
            class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-focus:tw-outline-none tw-focus:tw-ring-2 tw-focus:tw-ring-blue-500 tw-focus:tw-border-transparent tw-text-sm tw-pl-10"
            placeholder="Adresse email"
          />
        </div>
        <div *ngIf="authForm.get('email')?.invalid && authForm.get('email')?.touched" class="tw-text-red-500 tw-text-sm">
          Email invalide
        </div>
      </div>

      <!-- Champ mot de passe -->
      <div>
        <div class="tw-relative">
          <div class="tw-absolute tw-inset-y-0 tw-left-0 tw-pl-3 tw-flex tw-items-center tw-pointer-events-none">
            <i class="fas fa-lock tw-text-gray-400 tw-text-sm"></i>
          </div>
          <input
            type="password"
            formControlName="password"
            class="tw-w-full tw-px-3 tw-py-2 tw-border tw-border-gray-300 tw-rounded-lg tw-focus:tw-outline-none tw-focus:tw-ring-2 tw-focus:tw-ring-blue-500 tw-focus:tw-border-transparent tw-text-sm tw-pl-10"
            placeholder="Mot de passe"
          />
        </div>
        <div *ngIf="authForm.get('password')?.invalid && authForm.get('password')?.touched" class="tw-text-red-500 tw-text-sm">
          Mot de passe requis
        </div>
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="isLoading || authForm.invalid"
        class="tw-w-full tw-bg-blue-800 hover:tw-bg-blue-900 tw-text-white tw-rounded tw-px-4 tw-py-2"
      >
        <ng-container *ngIf="isLoading; else normalBtn">
          <div class="tw-flex tw-items-center tw-justify-center">
            <div class="tw-animate-spin tw-rounded-full tw-h-4 tw-w-4 tw-border-b-2 tw-border-white tw-mr-2"></div>
            Connexion...
          </div>
        </ng-container>
        <ng-template #normalBtn>
          Connexion
        </ng-template>
      </button>

      <!-- Mot de passe oublié -->
      <div class="tw-text-center">
        <a href="#" class="tw-text-sm tw-text-blue-600 hover:tw-text-blue-800 tw-underline">
          Mot de passe oublié
        </a>
      </div>
    </form>

  </div>

  <div class="tw-text-center tw-text-xs tw-text-gray-500">
    <p>© 2024 République du Bénin - Tous droits réservés</p>
  </div>
</div>
