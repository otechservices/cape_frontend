<div class="page-breadcrumb d-none d-sm-flex align-items-center mb-5">
    <div class="breadcrumb-title pe-3">CAPE </div>
    <div class="ps-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 p-0">
          <li class="breadcrumb-item"><a routerLink="/admin/dashboard"><i class="bx bx-home-alt"></i></a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Recherche</li>
        </ol>
      </nav>
    </div>
    <div class="ms-auto">
    </div>
  </div>

  <div class="tw-grid tw-grid-cols-12 tw-gap-4">
     <div class="tw-col-span-12">
       <div class="tw-bg-white tw-rounded-lg tw-shadow">
          
              <div class="tw-p-6">
                <form #formR="ngForm" (ngSubmit)="reset(formR)">
                    <div class="d-flex">
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="inputGroupSelect01">Département</label>
                            <select class="form-select" id="inputGroupSelect01" (change)="loadMunicipalities($event)" name="department_id" ngModel>
                                <option disabled selected>Choisir un département</option>
                                <option *ngFor="let d of departments" [value]="d.id">{{d.name}}</option>
                            </select>
                            <select class="form-select" id="inputGroupSelect01" (change)="loadDistricts($event)" name="municipality_id" ngModel>
                                <option disabled selected>Choisir une commune</option>

                                <option *ngFor="let m of municipalities" [value]="m.id">{{m.name}}</option>

                            </select>
                            <select class="form-select" id="inputGroupSelect01"  (change)="filter($event)" name="district_id" ngModel>
                                <option disabled selected>Choisir un arrondissement</option>

                                <option *ngFor="let ds of districts" [value]="ds.id">{{ds.name}}</option>

                            </select>
                            <button class="btn btn-outline-secondary" type="submit">Réinitialiser</button>

                          </div>
                    </div>
                </form>
                        <p>{{data.length}} élément(s)</p>
                        <div class="tw-overflow-x-auto">
                        <table class="tw-min-w-full tw-border tw-border-gray-200 tw-text-sm">
                            <thead class="tw-bg-gray-100">
                                <tr>
                                    <th class="tw-w-[40px] tw-px-3 tw-py-2">#</th>
                                    <th class="tw-px-3 tw-py-2">Libellé</th>
                                    <th class="tw-px-3 tw-py-2">Departement</th>
                                    <th class="tw-px-3 tw-py-2">Commune</th>
                                    <th class="tw-px-3 tw-py-2">Arrondissement</th>

                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let d of filteredData; let i=index ">
                                     <td class="tw-px-3 tw-py-2">
                                        {{i+1}}
                                    </td>
                                     <td class="tw-px-3 tw-py-2">{{d.name}}</td>
                                     <td class="tw-px-3 tw-py-2">{{d.district?.municipality?.department?.name}}</td>
                                     <td class="tw-px-3 tw-py-2">{{d.district?.municipality?.name}}</td>
                                     <td class="tw-px-3 tw-py-2">{{d.district?.name}}</td>
                                  
                               
                                </tr>
                            
                            </tbody>
                        </table>
                        </div>

            </div><!-- end card -->
        </div>
        <!-- end col -->
    </div>
    <!-- end col -->
</div>
