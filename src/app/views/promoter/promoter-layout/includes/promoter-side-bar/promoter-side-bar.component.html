<button
  class="tw-md:hidden tw-p-2 tw-rounded-lg tw-text-gray-600 hover:tw-bg-gray-100"
  (click)="toggleMenu()"
>
  <i class="fas fa-bars tw-text-2xl"></i>
</button>

<aside
  class="tw-fixed tw-left-0 tw-top-20 tw-w-64 tw-h-[calc(100vh-5rem)] tw-bg-white tw-shadow-lg tw-border-r tw-border-gray-200 tw-overflow-y-auto tw-hidden md:tw-block"
>
  <div class="tw-p-6">
    <h2 class="tw-text-lg tw-font-semibold tw-text-gray-900 tw-mb-6">Tableau de bord</h2>

    <nav class="tw-space-y-2">
      <button
        *ngFor="let item of menuItems"
        (click)="goTo(item.id)"
        [ngClass]="{
          'tw-bg-blue-50 tw-text-blue-700 tw-border-r-2 tw-border-blue-700':
            activeSection === item.id,
          'tw-text-gray-700 hover:tw-bg-gray-50 hover:tw-text-gray-900':
            activeSection !== item.id
        }"
        class="tw-w-full tw-flex tw-items-center tw-px-4 tw-py-3 tw-text-left tw-rounded-lg tw-transition-colors"
      >
        <i class="{{ item.icon }} tw-text-xl tw-mr-3 tw-w-6 tw-h-6 tw-flex tw-items-center tw-justify-center"></i>
        <span class="tw-font-medium">{{ item.label }}</span>
      </button>
    </nav>
  </div>
</aside>


<aside
  *ngIf="menuOpen"
  class="tw-fixed tw-inset-0 tw-bg-black/50 tw-z-50 tw-flex"
  (click)="toggleMenu()"
>
  <div
    class="tw-w-64 tw-bg-white tw-h-full tw-shadow-lg tw-overflow-y-auto tw-p-6"
    (click)="$event.stopPropagation()"
  >
    <button
      class="tw-absolute tw-top-4 tw-right-4 tw-text-gray-600 hover:tw-text-gray-900"
      (click)="toggleMenu()"
    >
      <i class="fas fa-times tw-text-xl"></i>
    </button>

    <h2 class="tw-text-lg tw-font-semibold tw-text-gray-900 tw-mb-6">Menu</h2>

    <nav class="tw-space-y-2">
      <button
        *ngFor="let item of menuItems"
        (click)="goTo(item.id); toggleMenu()"
        [ngClass]="{
          'tw-bg-blue-50 tw-text-blue-700 tw-border-r-2 tw-border-blue-700':
            activeSection === item.id,
          'tw-text-gray-700 hover:tw-bg-gray-50 hover:tw-text-gray-900':
            activeSection !== item.id
        }"
        class="tw-w-full tw-flex tw-items-center tw-px-4 tw-py-3 tw-text-left tw-rounded-lg tw-transition-colors"
      >
        <i class="{{ item.icon }} tw-text-xl tw-mr-3"></i>
        <span class="tw-font-medium">{{ item.label }}</span>
      </button>
    </nav>
  </div>
</aside>
