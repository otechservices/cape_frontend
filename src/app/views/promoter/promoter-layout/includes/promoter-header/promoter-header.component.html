<header class="tw-fixed tw-top-0 tw-right-0 tw-left-0 md:tw-left-64 tw-h-14 tw-z-30
              tw-bg-white tw-border-b tw-border-gray-200
              tw-flex tw-items-center tw-justify-between tw-px-6 tw-gap-4">

  <!-- Espace réservé au bouton hamburger mobile (rendu dans la sidebar) -->
  <div class="md:tw-hidden tw-w-9"></div>

  <!-- Titre (desktop uniquement) -->
  <div class="tw-hidden md:tw-flex tw-items-center tw-gap-2 tw-text-gray-400 tw-text-sm">
    <i class="ri-government-line"></i>
    <span>Plateforme de Gestion des Structures de Protection de l'Enfant</span>
  </div>

  <div class="tw-flex-1 md:tw-hidden"></div>

  <!-- Utilisateur -->
  <div class="tw-flex tw-items-center tw-gap-3 tw-flex-shrink-0">
    <div class="tw-w-8 tw-h-8 tw-bg-blue-900 tw-rounded-full
                tw-flex tw-items-center tw-justify-center
                tw-text-sm tw-font-bold tw-text-white tw-flex-shrink-0">
      {{ userInitial }}
    </div>
    <span class="tw-text-sm tw-font-medium tw-text-gray-700 tw-hidden sm:tw-block tw-max-w-xs tw-truncate">
      {{ userName }}
    </span>
  </div>

</header>
